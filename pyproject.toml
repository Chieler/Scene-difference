[project]
name = "humanoid-test"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.4",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "vggt",
]

[tool.uv.sources]
vggt = { git = "https://github.com/facebookresearch/vggt.git" }

[dependency-groups]
dev = [
    "pycocotools>=2.0.11",
    "pytest>=9.1.1",
]
